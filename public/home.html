<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Desk</title>
<!-- The design system, not a fifth palette. This page had its own :root, its
     own type scale and no sunlight mode, which is how the landing page ended
     up being the only screen on the desk you could not read outdoors. -->
<link rel="stylesheet" href="/desk.css">
<script src="/desk.js"></script>
<style>
/* Only the things that are this page's own shape. Everything with a colour or
   a size in it comes from /desk.css. */
body { max-width:860px; margin:0 auto; padding:26px 16px 56px; }
.head { display:flex; align-items:flex-start; gap:var(--s3); margin-bottom:var(--s5); }
.logo { font:700 var(--f-xs)/1.6 var(--ui); letter-spacing:.28em; color:var(--text3); }
.title { font-size:var(--f-xl); font-weight:700; letter-spacing:-.02em; margin:var(--s1) 0 0; }
.head .dk-sun { margin-left:auto; flex:0 0 auto; }
.note { margin-top:var(--s5); font-size:var(--f-xs); color:var(--text3); line-height:1.7; }
.version { margin-top:var(--s2); font-size:10.5px; color:var(--text3); letter-spacing:.06em; }
</style>
</head>
<body>

<div class="head">
  <div>
    <div class="logo">TRADE DESK</div>
    <h1 class="title">What are you doing today?</h1>
  </div>
  <button class="dk-sun" id="sun-btn" onclick="toggleSunlight()"
          title="high contrast, for reading the screen outdoors">☀</button>
</div>

<!-- The whole box, from one address. These are different programs with
     different jobs — charting and backtesting on one side, screening on the
     other — and they used to be two port numbers to remember.

     NO APP BAR HERE. Every other page carries one so it is never a dead end;
     on this page the doors ARE the bar, and a second copy of the same four
     names above them is one list too many. -->
<div class="dk-doors" id="apps"></div>

<div class="note">Four programs on one box. Each keeps its own data.</div>
<div class="version">v2.0 · multi-tool</div>

<script>
/*
 * THE LANDING PAGE DOES ONE THING: it names the programs on this box.
 *
 * It used to be the landing page AND the screener dashboard AND the shared
 * shortlist AND the CANSLIM list AND the comparison table — one scroll, five
 * jobs, arriving in whatever order the network answered. The first question of
 * the day is "which program", and everything below the answer was competing
 * with it.
 *
 * Three levels now:
 *
 *   /             which program            (here)
 *   /screeners    which of the nine, and the lists all of them read
 *   a tool        the screener itself
 *
 * Everything that used to sit below the app cards moved to
 * public/screeners.html, unchanged. Nothing was deleted; it was filed.
 */

/*
 * A DOOR: a name, ONE line, and where it goes.
 *
 * It used to carry a paragraph — three sentences about registers and archive
 * processes, on the page whose only question is "which program", read before
 * you have chosen the program they describe. Nobody reads a card twice, so the
 * second and third sentences were never read at all; they were only ever in
 * the way of the name. The long `desc` is still in tools.config.json for the
 * places that have room for it, and is the fallback here for an app added
 * without a `one`, cut at its first sentence rather than printed whole.
 *
 * IT CARRIES NO STATUS. These are separate programs. The chart platform does
 * not serve this page's /health and has no reason to send CORS headers for it,
 * so asking "is it up" from here gets a network error whether it is up or not
 * — and claiming "offline" on that basis would be a lie the page cannot back
 * up.
 *
 * NO ICONS. Four glyphs that have to be learned are four things between you
 * and a name you can already read, and picked from an emoji font they render
 * differently on every device. Identity is the accent stripe, which is the
 * same colour that program uses everywhere else.
 */
function appDoor(a) {
  // `self` is true: this page and the screener suite are the same process.
  const url = deskAppHref(a, true);
  // Say where it actually goes. "port 3090" under a card that opens an https
  // domain is a wrong answer to "which port do I open in AWS".
  const where = a.url ? new URL(url, location.href).host
    : (a.isSelf ? 'this server' : `port ${a.port}`);
  const one = a.one || deskFirstSentence(a.desc);
  return `
    <a class="dk-door" href="${deskEsc(url)}" style="--dk-accent:${deskEsc(a.accent || '#3b82f6')}">
      <div class="dk-door-name">${deskEsc(a.name)}</div>
      <div class="dk-door-one">${deskEsc(one)}</div>
      <div class="dk-door-at">${deskEsc(where)} &rarr;</div>
    </a>`;
}

async function start() {
  const el = document.getElementById('apps');
  try {
    const d = await (await fetch('/api/tools')).json();
    const apps = d.apps || [];
    if (!apps.length) throw new Error('the app list came back empty');
    el.innerHTML = apps.map(appDoor).join('');
  } catch (e) {
    // A landing page with no doors is worse than one that says why it has none.
    el.innerHTML = `<div class="dk-door" style="--dk-accent:var(--red)">
      <div class="dk-door-name">Could not read the app list</div>
      <div class="dk-door-one">${deskEsc(e.message)} — this page reads
        tools.config.json through /api/tools.</div>
    </div>`;
  }
}
start();
</script>
</body>
</html>
