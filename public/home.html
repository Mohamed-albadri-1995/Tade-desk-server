<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Desk</title>
<style>
:root {
  --bg:#0d0f14; --bg2:#13161e; --bg3:#1a1e28; --border:#2a2f3f;
  --text:#e2e6f0; --text2:#8b92a5; --text3:#5a6175;
  --accent:#4a9eff; --green:#4ade80; --red:#f87171; --amber:#fbbf24;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  display:flex; flex-direction:column; align-items:center;
  padding:48px 20px 40px;
}
.logo { font-size:13px; letter-spacing:.28em; color:var(--accent); font-weight:700; }
.title { font-size:28px; font-weight:700; margin:14px 0 6px; letter-spacing:-.02em; text-align:center; }
.subtitle { font-size:13px; color:var(--text2); margin-bottom:32px; text-align:center; }

.cards { display:flex; flex-wrap:wrap; gap:16px; justify-content:center;
         width:100%; max-width:1000px; }
.tool-card {
  position:relative; width:300px; background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; padding:20px; text-decoration:none; color:inherit;
  display:flex; flex-direction:column; gap:8px; transition:border-color .15s, transform .15s;
  border-top:3px solid var(--accent);
}
.tool-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.tool-card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.tool-card.t2 { border-top-color:#a78bfa; }
.tool-card.t3 { border-top-color:#fb923c; }
.tool-card.down { opacity:.55; border-top-color:var(--text3); }

.card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.card-name { font-size:17px; font-weight:700; letter-spacing:-.01em; }
.card-port { font-size:10px; color:var(--text3); letter-spacing:.06em; }
.card-desc { font-size:12px; color:var(--text2); line-height:1.6; min-height:3.2em; }

.status { display:flex; align-items:center; gap:6px; font-size:10.5px;
          letter-spacing:.06em; text-transform:uppercase; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--text3); flex:none; }
.status.up .dot { background:var(--green); box-shadow:0 0 6px var(--green); }
.status.up { color:var(--green); }
.status.down .dot { background:var(--red); }
.status.down { color:var(--red); }
.status.wait .dot { background:var(--amber); }
.status.wait { color:var(--amber); }

.stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:2px; }
.stat { font-size:10.5px; color:var(--text2); background:var(--bg3);
        border:1px solid var(--border); border-radius:4px; padding:2px 7px; }
.arrow { position:absolute; right:18px; bottom:16px; color:var(--accent); font-size:16px; }

.note { margin-top:30px; font-size:11px; color:var(--text3); text-align:center;
        max-width:56ch; line-height:1.7; }
.version { margin-top:22px; font-size:10.5px; color:var(--text3); letter-spacing:.06em; }
@media (max-width:580px) {
  body { padding:32px 14px; }
  .title { font-size:22px; }
  .tool-card { width:100%; max-width:340px; }
}
</style>
</head>
<body>

<div class="logo">TRADE DESK</div>
<div class="title">What are you doing today?</div>
<div class="subtitle">Each tool screens differently and learns from its own history.</div>

<div class="cards" id="cards"></div>

<div class="note">
  Every tool runs its own screeners, keeps its own registers and shortlist, and trains
  its own model. Nothing is shared between them, so what one learns never leaks into another.
</div>
<div class="version">v2.0 · multi-tool</div>

<script>
// Tools come from tools.config.json via /api/tools, so adding one means
// editing that file alone. Fetched from THIS origin, which is always up
// (it served this page), then each tool is probed individually — a tool that
// is down still gets a card, because the point is to show WHICH one is down.
let TOOLS = [];

// A tool may be served on its own port or behind a path on this host; try the
// port first, fall back to same-origin so it works either way.
function baseFor(t) {
  return `${location.protocol}//${location.hostname}:${t.port}`;
}

function card(t, state, info) {
  const cls = state === 'down' ? 'down' : '';
  const label = { up:'online', down:'offline', wait:'checking' }[state];
  const stats = [];
  if (info && info.rows != null) stats.push(`${info.rows} live`);
  if (info && info.model) stats.push(info.model);
  return `
    <a class="tool-card ${cls}" href="${baseFor(t)}/scanner"
       style="border-top-color:${state === 'down' ? 'var(--text3)' : (t.accent || 'var(--accent)')}">
      <div class="card-top">
        <div>
          <div class="card-name">${t.name}</div>
          <div class="card-port">${t.id} · PORT ${t.port}</div>
        </div>
        <div class="status ${state}"><span class="dot"></span>${label}</div>
      </div>
      <div class="card-desc">${t.desc}</div>
      <div class="stats">${stats.map(s => `<span class="stat">${s}</span>`).join('')}</div>
      <span class="arrow">→</span>
    </a>`;
}

function render(states) {
  document.getElementById('cards').innerHTML =
    TOOLS.map(t => card(t, states[t.id].state, states[t.id].info)).join('');
}

const states = {};

async function probe(t) {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 3000);
    const r = await fetch(`${baseFor(t)}/health`, { signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('bad status');
    await r.json();
    states[t.id] = { state:'up', info:null };

    // Best-effort extras — a tool that is up but still warming up should not
    // be shown as down just because these are not ready yet.
    try {
      const [reg, an] = await Promise.all([
        fetch(`${baseFor(t)}/api/registry/today`).then(x => x.json()).catch(() => null),
        fetch(`${baseFor(t)}/api/analysis/status`).then(x => x.json()).catch(() => null),
      ]);
      states[t.id].info = {
        rows: reg && typeof reg.count === 'number' ? reg.count : null,
        model: an ? (an.ready ? 'model ready' : 'model not trained') : null,
      };
    } catch { /* leave info null */ }
  } catch {
    states[t.id] = { state:'down', info:null };
  }
  render(states);
}

async function start() {
  try {
    const r = await fetch('/api/tools');
    const d = await r.json();
    TOOLS = d.tools || [];
  } catch {
    document.getElementById('cards').innerHTML =
      '<div class="note">Could not load the tool list.</div>';
    return;
  }
  TOOLS.forEach(t => { states[t.id] = { state:'wait', info:null }; });
  render(states);
  TOOLS.forEach(probe);
  setInterval(() => TOOLS.forEach(probe), 30000);
}
start();
</script>

</body>
</html>
