<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0e16;--panel:#11151f;--line:#1d2434;--line2:#262f44;
  --ink:#e6eaf5;--dim:#8b94ac;--faint:#5d667e;
  --accent:#22d3ee;--accent-soft:rgba(34,211,238,.14);
  --good:#34d399;--bad:#f87171;--radius:10px;
}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
body{padding:0;
  background:radial-gradient(900px 400px at 80% -5%,rgba(34,211,238,.07),transparent 60%),
             radial-gradient(700px 350px at -5% 5%,rgba(124,58,237,.06),transparent 55%),
             var(--bg);
}
a{color:var(--accent);text-decoration:none}
/* ── Header ── */
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:12px 16px;border-bottom:1px solid var(--line);background:#0d111c}
.page-header h1{font-size:16px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.scope-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{background:#0f1623;border:1px solid var(--line2);border-radius:6px;
  color:var(--ink);padding:5px 10px;font-size:12px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
button{cursor:pointer;border:none;border-radius:6px;font-size:12px;font-weight:600;
  padding:5px 12px;transition:opacity .12s,transform .1s}
button:active{opacity:.7;transform:scale(.97)}
.btn-primary{background:var(--accent);color:#0b0e16}
.btn-sec{background:var(--line2);color:var(--ink)}
/* ── Tabs ── */
.tab-bar{display:flex;gap:2px;overflow-x:auto;padding:10px 16px 0;border-bottom:1px solid var(--line);
  scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--dim);padding:7px 14px;font-size:12px;font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--ink)}
/* ── Content ── */
.content{padding:14px 16px 40px;max-width:900px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}
/* ── KPI Grid ── */
.jnl-kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.jnl-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.k-label{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:3px}
.k-value{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:2px}
.k-sub{font-size:10px;color:var(--dim)}
.jnl-hero-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.jnl-hero-row .jnl-kpi{flex:1;min-width:140px}
.jnl-ratio-strip{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10px;color:var(--dim);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-bottom:8px}
/* ── Calendar ── */
.jnl-cal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:6px}
.jnl-cal-cell{border-radius:5px;padding:4px 5px;min-height:46px}
/* ── Stats details ── */
.jnl-stat-group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.jnl-stat-group summary{padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;list-style:none;color:var(--ink)}
.jnl-stat-group summary::-webkit-details-marker{display:none}
.jnl-stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;padding:8px 12px 12px}
.jnl-stat-card{background:#0d1220;border-radius:6px;padding:7px 9px}
.s-name{font-size:9px;color:var(--faint);margin-bottom:3px}
.s-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
/* ── Trades list ── */
.jnl-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px}
.jnl-day-head{background:#0d1220;border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 12px;margin-bottom:6px;border-left:3px solid var(--line2)}
.jnl-day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:4px;
  font-size:10px;color:var(--dim);margin-top:5px}
/* ── Import ── */
.import-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.import-box textarea{width:100%;height:100px;background:#090c14;border:1px solid var(--line2);
  border-radius:6px;color:var(--ink);font-size:11px;padding:8px;resize:vertical;margin-top:6px}
/* ── Misc ── */
.note{font-size:10px;color:var(--dim);margin-top:4px}
.err{color:var(--bad);font-size:11px;margin-top:4px}
.ok{color:var(--good);font-size:11px;margin-top:4px}
.jnl-corr-note{font-size:11px;color:var(--faint);padding:10px 0;text-align:center}
.jnl-corr-tab-btn{background:#1e293b;color:var(--dim);border:1px solid var(--line2);
  border-radius:5px;padding:3px 10px;font-size:11px}
details.jnl-stat-group[open] summary{border-bottom:1px solid var(--line);margin-bottom:0}
table.jnl-tbl{width:100%;border-collapse:collapse;font-size:11px}
table.jnl-tbl th{text-align:right;padding:4px 8px;color:var(--faint);font-weight:600}
table.jnl-tbl th:first-child{text-align:left;padding-left:0}
table.jnl-tbl td{text-align:right;padding:5px 8px;border-bottom:1px solid #1e293b22;color:var(--dim)}
table.jnl-tbl td:first-child{text-align:left;padding-left:0;color:var(--ink);font-weight:600}
.spinner{text-align:center;padding:30px;color:var(--faint)}
</style>
</head>
<body>

<div class="page-header">
  <h1>📒 Trade Journal</h1>
  <div class="scope-row">
    <select id="filter-account"><option value="">All accounts</option></select>
    <select id="filter-source"><option value="">All sources</option></select>
    <button class="btn-primary" onclick="loadAll()">↻ Refresh</button>
    <a href="/" style="font-size:11px;color:var(--dim)">← Dashboard</a>
  </div>
</div>

<div class="tab-bar" id="tab-bar">
  <button class="tab-btn" data-tab="overview">Overview</button>
  <button class="tab-btn" data-tab="calendar">Calendar</button>
  <button class="tab-btn" data-tab="time">Time</button>
  <button class="tab-btn" data-tab="risk">Risk</button>
  <button class="tab-btn" data-tab="stats">Stats</button>
  <button class="tab-btn" data-tab="setups">Setups</button>
  <button class="tab-btn" data-tab="trades">Trades</button>
  <button class="tab-btn" data-tab="import">Import</button>
</div>

<div class="content">
  <div id="load-status" class="spinner">Loading trades…</div>

  <div id="tab-overview" class="tab-panel">
    <div id="jnl-overview-dash"></div>
  </div>

  <div id="tab-calendar" class="tab-panel">
    <div id="jnl-calendar-dash"></div>
  </div>

  <div id="tab-time" class="tab-panel">
    <div id="jnl-time-dash"></div>
  </div>

  <div id="tab-risk" class="tab-panel">
    <div id="jnl-risk-dash"></div>
  </div>

  <div id="tab-stats" class="tab-panel">
    <div id="jnl-stats-catalog"></div>
  </div>

  <div id="tab-setups" class="tab-panel">
    <div id="jnl-setup-stats"></div>
  </div>

  <div id="tab-trades" class="tab-panel">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <input id="filter-ticker" placeholder="Ticker…" style="width:90px" oninput="renderTrades()">
      <select id="filter-side" onchange="renderTrades()">
        <option value="">Both sides</option>
        <option value="long">Long</option>
        <option value="short">Short</option>
      </select>
      <select id="filter-status" onchange="renderTrades()">
        <option value="">All</option>
        <option value="closed">Closed</option>
        <option value="open">Open</option>
      </select>
      <select id="sort-trades" onchange="renderTrades()">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="pnl-desc">Best P&L</option>
        <option value="pnl-asc">Worst P&L</option>
      </select>
    </div>
    <div id="jnl-stats-bar" style="font-size:11px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px"></div>
    <div id="jnl-cards-container"></div>
  </div>

  <div id="tab-import" class="tab-panel">
    <div class="import-box">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">Import CSV</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:8px">
        Supports: TradingView fills, TradingView paper log (Time/Text), Trade the Pool orders (semicolons), DXtrade orders.
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <label style="background:var(--line2);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600">
          📂 Choose CSV
          <input type="file" accept=".csv,.txt" style="display:none" onchange="onImportFile(event)">
        </label>
        <input id="import-account" placeholder="Account label (optional)" style="width:180px">
      </div>
      <div style="font-size:10px;color:var(--faint);margin-bottom:4px">— or paste below —</div>
      <textarea id="import-csv" placeholder="Paste CSV content here…"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn-primary" onclick="doImport()">Import</button>
        <button class="btn-sec" onclick="document.getElementById('import-csv').value=''">Clear</button>
      </div>
      <div id="import-msg"></div>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
var __allTrades = [];   // raw DB format
var __trades = [];      // adapted format, scope-filtered
var __setups = [];      // from /api/trading/setups

// ── Adapt DB format → popup.js format ────────────────────────────────────────
function adaptTrade(t) {
  function makeTs(date, time) {
    if (!date || !time) return null;
    var hm = time.slice(0, 5);
    return new Date(date + 'T' + hm + ':00Z').getTime();
  }
  return {
    id: t.id, ticker: t.ticker, date: t.date,
    side: t.direction === 'Long' ? 'long' : 'short',
    account: t.account || null, source: t.source || null,
    entryTs: makeTs(t.date, t.entry_time),
    exitTs: makeTs(t.date, t.exit_time),
    entryPrice: t.entry_price, exitPrice: t.exit_price,
    shares: t.shares, closedShares: t.shares,
    grossPnl: t.gross_pnl, netPnl: t.net_pnl,
    pctMove: t.pct_move, totalComm: t.commission || 0,
    csvComm: t.commission || 0, durationMs: t.duration_ms,
    open: t.status !== 'closed',
    entryFills: [], exitFills: [],
    setup_id: t.setup_id,
    setup: (function(){ var s=__setups.find(function(s){return s.id===t.setup_id;}); return s?s.name:(t.setup_id||null); })(),
    sl: t.sl, tp: t.tp,
    notes: t.notes,
  };
}

// ── Load & scope ──────────────────────────────────────────────────────────────
async function loadAll() {
  document.getElementById('load-status').style.display = 'block';
  try {
    var results = await Promise.all([
      fetch('/api/journal/trades').then(function(r){return r.json();}),
      fetch('/api/trading/setups').then(function(r){return r.json();}).catch(function(){return [];})
    ]);
    __allTrades = results[0];
    __setups = results[1].filter(function(s){return s.enabled;});
    populateFilters();
    applyScope();
    renderAll();
  } catch(e) {
    document.getElementById('load-status').textContent = 'Error: ' + e.message;
    return;
  }
  document.getElementById('load-status').style.display = 'none';
}

function populateFilters() {
  var accts = {}, srcs = {};
  __allTrades.forEach(function(t) {
    if (t.account) accts[t.account] = true;
    if (t.source)  srcs[t.source]   = true;
  });
  function fill(id, vals) {
    var el = document.getElementById(id);
    var prev = el.value;
    el.innerHTML = '<option value="">All</option>' +
      Object.keys(vals).sort().map(function(v) {
        return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
      }).join('');
    if (prev) el.value = prev;
  }
  fill('filter-account', accts);
  fill('filter-source', srcs);
}

function applyScope() {
  var acct = document.getElementById('filter-account').value;
  var src  = document.getElementById('filter-source').value;
  __trades = __allTrades.filter(function(t) {
    if (acct && (t.account || '') !== acct) return false;
    if (src  && (t.source  || '') !== src)  return false;
    return true;
  }).map(adaptTrade);
}

function renderAll() {
  jnl_renderOverviewDash(__trades);
  jnl_renderCalendarTab(__trades);
  jnl_renderTimeTab(__trades);
  jnl_renderRiskTab(__trades);
  jnl_renderStatsCatalog(__trades);
  jnl_renderSetupStatsSection(__trades);
  renderTrades();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function jnl_fmt$(v) {
  if (v == null) return '—';
  var abs = Math.abs(v);
  var s = abs >= 1e3 ? abs.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : abs.toFixed(2);
  return (v < 0 ? '-$' : '$') + s;
}
function jnl_fmtPct(v) {
  if (v == null) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function jnl_fmtDur(ms) {
  if (!ms) return '—';
  var s = Math.floor(ms/1e3), m = Math.floor(s/60); s%=60;
  var h = Math.floor(m/60); m%=60;
  if (h) return h+'h '+m+'m';
  if (m) return m+'m '+s+'s';
  return s+'s';
}
function jnl_fmtTime(ts) {
  if (!ts) return '—';
  var d = new Date(ts);
  return d.getUTCHours().toString().padStart(2,'0')+':'+d.getUTCMinutes().toString().padStart(2,'0');
}
function jnl_mean(arr) {
  return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null;
}
function jnl_stdev(arr) {
  if (!arr || arr.length < 2) return null;
  var m = jnl_mean(arr);
  return Math.sqrt(arr.reduce(function(a,b){return a+(b-m)*(b-m);},0)/(arr.length-1));
}
function jnl_dailyPnl(trades) {
  var days = {};
  (trades||[]).forEach(function(t) {
    if (t.open || t.netPnl == null) return;
    if (!days[t.date]) days[t.date] = {pnl:0, count:0, wins:0};
    days[t.date].pnl += t.netPnl;
    days[t.date].count++;
    if (t.netPnl > 0) days[t.date].wins++;
  });
  return days;
}
function jnl_equitySeries(trades) {
  var closed = (trades||[]).filter(function(t){return !t.open && t.netPnl!=null;})
    .slice().sort(function(a,b){return (a.exitTs||a.entryTs)-(b.exitTs||b.entryTs);});
  var eq=0, peak=0, maxDD=0, peakAtMaxDD=0;
  var points = closed.map(function(t) {
    eq += t.netPnl;
    if (eq > peak) peak = eq;
    var dd = peak - eq;
    if (dd > maxDD) { maxDD = dd; peakAtMaxDD = peak; }
    return {ts: t.exitTs||t.entryTs, eq:eq, peak:peak, dd:dd};
  });
  return {points:points, maxDD:maxDD, maxDDPct: peakAtMaxDD>0 ? maxDD/peakAtMaxDD*100 : null};
}

// ── signedR adapted (no exitAnalysis) ────────────────────────────────────────
function jnl_signedR(t) {
  if (t.sl==null || t.entryPrice==null || t.shares==null || t.netPnl==null) return null;
  var risk = Math.abs(t.entryPrice - t.sl) * t.shares;
  if (!risk) return null;
  return t.netPnl / risk;
}

// ── Bucket keys (ET timestamps stored as UTC) ─────────────────────────────────
function jnl_hourKey(t) {
  if (!t.entryTs) return null;
  var h = new Date(t.entryTs).getUTCHours();
  return String(h).padStart(2,'0') + ':00';
}
var JNL_DOW = ['Mon','Tue','Wed','Thu','Fri'];
function jnl_dowKey(t) {
  var dw = (new Date(t.date+'T12:00Z').getUTCDay()+6)%7;
  return dw < 5 ? JNL_DOW[dw] : null;
}
var JNL_PRICE_BUCKETS = [[0,2,'$0–2'],[2,5,'$2–5'],[5,10,'$5–10'],[10,20,'$10–20'],[20,50,'$20–50'],[50,100,'$50–100'],[100,Infinity,'$100+']];
function jnl_priceKey(t) {
  if (t.entryPrice==null) return null;
  for (var i=0;i<JNL_PRICE_BUCKETS.length;i++)
    if (t.entryPrice>=JNL_PRICE_BUCKETS[i][0] && t.entryPrice<JNL_PRICE_BUCKETS[i][1]) return JNL_PRICE_BUCKETS[i][2];
  return null;
}
var JNL_SIZE_BUCKETS = [[0,100,'0–99 sh'],[100,500,'100–499'],[500,1e3,'500–999'],[1e3,2e3,'1000–1999'],[2e3,Infinity,'2000+']];
function jnl_sizeKey(t) {
  if (t.shares==null) return null;
  for (var i=0;i<JNL_SIZE_BUCKETS.length;i++)
    if (t.shares>=JNL_SIZE_BUCKETS[i][0] && t.shares<JNL_SIZE_BUCKETS[i][1]) return JNL_SIZE_BUCKETS[i][2];
  return null;
}
function jnl_setupLabel(trade) { return trade.setup || null; }

// ── Core metrics ──────────────────────────────────────────────────────────────
function jnl_accountMetrics(trades) {
  var closed = (trades||[]).filter(function(t){return !t.open && t.netPnl!=null;});
  var wins = closed.filter(function(t){return t.netPnl>0;});
  var losses = closed.filter(function(t){return t.netPnl<0;});
  var netPnl = closed.reduce(function(a,t){return a+t.netPnl;},0);
  var grossWin = wins.reduce(function(a,t){return a+t.netPnl;},0);
  var grossLoss = losses.reduce(function(a,t){return a+t.netPnl;},0);
  var winRate = closed.length ? wins.length/closed.length*100 : null;
  var pf = grossLoss < 0 ? grossWin/-grossLoss : grossWin > 0 ? Infinity : null;
  var expectancy = closed.length ? netPnl/closed.length : null;
  var rVals = closed.map(jnl_signedR).filter(function(r){return r!=null;});
  var expectancyR = rVals.length ? jnl_mean(rVals) : null;
  var avgWin = wins.length ? grossWin/wins.length : null;
  var avgLoss = losses.length ? grossLoss/losses.length : null;
  var payoff = avgWin!=null && avgLoss!=null && avgLoss<0 ? avgWin/-avgLoss : null;
  var es = jnl_equitySeries(closed);
  var rStd = jnl_stdev(rVals);
  var sqn = rStd>0 ? jnl_mean(rVals)/rStd*Math.sqrt(Math.min(rVals.length,100)) : null;
  var kelly = payoff!=null && winRate!=null ? (winRate/100-(1-winRate/100)/payoff)*100 : null;
  var recovery = es.maxDD>0 ? netPnl/es.maxDD : null;
  var dvals = Object.values(jnl_dailyPnl(closed)).map(function(d){return d.pnl;});
  var dStd = jnl_stdev(dvals);
  var consistency = dStd>0 ? jnl_mean(dvals)/dStd*Math.sqrt(252) : null;
  var holdWin = jnl_mean(wins.map(function(t){return t.durationMs;}).filter(function(d){return d!=null;}));
  var holdLoss = jnl_mean(losses.map(function(t){return t.durationMs;}).filter(function(d){return d!=null;}));
  var fees = closed.reduce(function(a,t){return a+(t.totalComm||0);},0);
  var byTime = closed.slice().sort(function(a,b){return a.entryTs-b.entryTs;});
  var ws=0,ls=0,maxWs=0,maxLs=0;
  byTime.forEach(function(t) {
    if (t.netPnl>0){ws++;ls=0;}else if(t.netPnl<0){ls++;ws=0;}
    if (ws>maxWs) maxWs=ws; if (ls>maxLs) maxLs=ls;
  });
  var longs = closed.filter(function(t){return t.side==='long';});
  var shorts = closed.filter(function(t){return t.side==='short';});
  return {
    closed:closed.length, wins:wins.length, losses:losses.length,
    netPnl:netPnl, grossWin:grossWin, grossLoss:grossLoss,
    winRate:winRate, profitFactor:pf, expectancy:expectancy, expectancyR:expectancyR,
    avgWin:avgWin, avgLoss:avgLoss, payoff:payoff,
    maxDD:es.maxDD, maxDDPct:es.maxDDPct,
    sqn:sqn, kelly:kelly, recovery:recovery, consistency:consistency,
    holdWin:holdWin, holdLoss:holdLoss, fees:fees,
    maxWinStreak:maxWs, maxLossStreak:maxLs,
    longCount:longs.length, longPnl:longs.reduce(function(a,t){return a+t.netPnl;},0),
    shortCount:shorts.length, shortPnl:shorts.reduce(function(a,t){return a+t.netPnl;},0),
    rCount:rVals.length
  };
}

// ── SVG helpers ───────────────────────────────────────────────────────────────
function jnl_equityCurveSvg(trades, w, h) {
  var es = jnl_equitySeries(trades); var pts = es.points;
  if (pts.length < 2) return '';
  w=w||600; h=h||150; var pad=6;
  var vals=[]; pts.forEach(function(p){vals.push(p.eq,p.peak);}); vals.push(0);
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if (max===min) max=min+1;
  function X(i){return pad+i/(pts.length-1)*(w-2*pad);}
  function Y(v){return h-pad-(v-min)/(max-min)*(h-2*pad);}
  var eqPath = pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(p.eq).toFixed(1);}).join('');
  var pkPath = pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(p.peak).toFixed(1);}).join('');
  var ddPoly = pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.peak).toFixed(1);})
    .concat(pts.slice().reverse().map(function(p,i){return X(pts.length-1-i).toFixed(1)+','+Y(p.eq).toFixed(1);})).join(' ');
  var zeroY = Y(0);
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">' +
    '<line x1="'+pad+'" y1="'+zeroY.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zeroY.toFixed(1)+'" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>' +
    '<polygon points="'+ddPoly+'" fill="#ef4444" opacity="0.13"/>' +
    '<path d="'+pkPath+'" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2,3"/>' +
    '<path d="'+eqPath+'" fill="none" stroke="#3b82f6" stroke-width="2"/>' + '</svg>';
}
function jnl_donutSvg(pct, color) {
  var r=24, c=2*Math.PI*r, filled=Math.max(0,Math.min(100,pct))/100*c;
  return '<svg viewBox="0 0 64 64" style="width:58px;height:58px">' +
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="#1e293b" stroke-width="7"/>' +
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" ' +
    'stroke-dasharray="'+filled.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 32 32)"/>' +
    '<text x="32" y="36" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">'+Math.round(pct)+'%</text>' + '</svg>';
}

// ── Bucket stats ──────────────────────────────────────────────────────────────
function jnl_bucketStats(trades, keyFn, order) {
  var b = {};
  (trades||[]).forEach(function(t) {
    if (t.open || t.netPnl==null) return;
    var k = keyFn(t); if (k==null) return;
    if (!b[k]) b[k]={n:0,wins:0,pnl:0};
    b[k].n++; b[k].pnl+=t.netPnl; if (t.netPnl>0) b[k].wins++;
  });
  return (order||Object.keys(b).sort()).filter(function(k){return b[k];}).map(function(k) {
    return {label:k, n:b[k].n, winRate:b[k].n?b[k].wins/b[k].n*100:null, pnl:b[k].pnl, exp:b[k].pnl/b[k].n};
  });
}
function jnl_barTable(title, rows) {
  var maxAbs=0; rows.forEach(function(r){maxAbs=Math.max(maxAbs,Math.abs(r.pnl));});
  return '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;margin-bottom:10px">' +
    '<div style="color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:8px">'+esc(title)+'</div>' +
    rows.map(function(r) {
      var pct=maxAbs>0?Math.round(Math.abs(r.pnl)/maxAbs*100):0;
      var color=r.pnl>=0?'#22c55e':'#ef4444';
      return '<div style="padding:4px 0 7px">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:11px">' +
        '<span style="color:#cbd5e1">'+esc(r.label)+'</span>' +
        '<span style="color:'+color+';font-weight:700;font-variant-numeric:tabular-nums">'+jnl_fmt$(r.pnl)+'</span></div>' +
        '<div style="height:4px;border-radius:2px;background:#1e293b;margin:4px 0 2px;overflow:hidden">' +
        '<div style="height:100%;width:'+Math.max(pct,r.pnl?2:0)+'%;background:'+color+'"></div></div>' +
        '<div style="font-size:9px;color:#64748b">'+r.n+' trades · win '+(r.winRate!=null?r.winRate.toFixed(0)+'%':'—')+' · '+jnl_fmt$(r.exp)+'/trade</div>' +
        '</div>';
    }).join('') + '</div>';
}

// ── Insights ──────────────────────────────────────────────────────────────────
function jnl_computeInsights(trades) {
  var closed=(trades||[]).filter(function(t){return !t.open && t.netPnl!=null;});
  if (closed.length < 5) return [];
  var grossWin = closed.reduce(function(a,t){return a+Math.max(0,t.netPnl);},0);
  var grossLoss = closed.reduce(function(a,t){return a+Math.min(0,t.netPnl);},0);
  var dims=[
    {name:'the {l} hour',fn:jnl_hourKey},
    {name:'{l}s',fn:jnl_dowKey},
    {name:'{l} stocks',fn:jnl_priceKey},
    {name:'{l} positions',fn:jnl_sizeKey},
    {name:'{l} trades',fn:function(t){return t.side;}}
  ];
  var found=[];
  dims.forEach(function(dim) {
    jnl_bucketStats(closed,dim.fn).forEach(function(r) {
      if (r.n < 2) return;
      found.push({name:dim.name.replace('{l}',r.label), pnl:r.pnl, n:r.n, winRate:r.winRate,
        share:r.pnl>=0?grossWin>0?r.pnl/grossWin*100:null:grossLoss<0?r.pnl/grossLoss*100:null});
    });
  });
  found.sort(function(a,b){return Math.abs(b.pnl)-Math.abs(a.pnl);});
  var out=[], pos=0, neg=0;
  for (var i=0;i<found.length && out.length<4;i++) {
    var f=found[i];
    if (f.pnl>=0 && pos>=2) continue;
    if (f.pnl<0 && neg>=2) continue;
    if (f.pnl>=0) pos++; else neg++;
    var shareTxt=f.share!=null?' ('+Math.round(f.share)+'% of all '+(f.pnl>=0?'profits':'losses')+')':'';
    out.push({good:f.pnl>=0,
      text:(f.pnl>=0?f.name.charAt(0).toUpperCase()+f.name.slice(1)+' contributed '+jnl_fmt$(f.pnl)+shareTxt+' across '+f.n+' trades (win '+Math.round(f.winRate)+'%).'
                     :f.name.charAt(0).toUpperCase()+f.name.slice(1)+' cost '+jnl_fmt$(f.pnl)+shareTxt+' across '+f.n+' trades (win '+Math.round(f.winRate)+'%).')});
  }
  return out;
}

    tile('PROFIT FACTOR',pfStr,pfColor,'$'+Math.round(m.grossWin)+' won / $'+Math.round(-m.grossLoss)+' lost','$ won per $ lost — >1.5 good')+
    tile('EXPECTANCY',jnl_fmt$(m.expectancy),pn(m.expectancy),m.expectancyR!=null?f2(m.expectancyR,'R')+' per trade':'set SL on trades','Avg $ per trade long-run')+

// ── Calendar ──────────────────────────────────────────────────────────────────
function jnl_renderCalendarTab(trades) {
  var el=document.getElementById('jnl-calendar-dash'); if (!el) return;
  var days=jnl_dailyPnl(trades);
  var keys=Object.keys(days).sort();
  if (!keys.length) { el.innerHTML='<div class="jnl-corr-note">No closed trades yet.</div>'; return; }
  var month;
  try { month=localStorage.getItem('jnl_cal_month'); } catch(_){}
  if (!month||!/^\d{4}-\d{2}$/.test(month)) month=keys[keys.length-1].slice(0,7);
  var y=parseInt(month.slice(0,4),10), mo=parseInt(month.slice(5,7),10);
  var maxAbs=0;
  keys.forEach(function(k){if(k.slice(0,7)===month)maxAbs=Math.max(maxAbs,Math.abs(days[k].pnl));});
  var first=new Date(Date.UTC(y,mo-1,1)), dim=new Date(Date.UTC(y,mo,0)).getUTCDate();
  var monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var html='<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
    '<button class="jnl-corr-tab-btn jnl-cal-nav" data-dir="-1">‹</button>'+
    '<span style="color:#94a3b8;font-size:12px;font-weight:700">'+monthNames[mo-1]+' '+y+'</span>'+
    '<button class="jnl-corr-tab-btn jnl-cal-nav" data-dir="1">›</button></div>';
  html+='<div class="jnl-cal-grid">'+
    ['Mon','Tue','Wed','Thu','Fri','Week'].map(function(d,i){
      return '<div style="color:'+(i===5?'#93c5fd':'#475569')+';font-size:9px;font-weight:700;text-align:center">'+d+'</div>';
    }).join('');
  var monthTotal=0, monthTrades=0;
  var dow0=(first.getUTCDay()+6)%7;
  var cells=[], weekSum=0, weekHas=false;
  function flushWeek(){
    cells.push('<div class="jnl-cal-cell" style="background:#0b1220;border:1px solid #1e293b">'+
      (weekHas?'<div style="font-size:10px;font-weight:700;color:'+(weekSum>=0?'#22c55e':'#ef4444')+'">'+jnl_fmt$(weekSum)+'</div>':'<div style="color:#1e293b">—</div>')+
      '</div>');
    weekSum=0; weekHas=false;
  }
  if (dow0<5) for(var pad=0;pad<dow0;pad++) cells.push('<div></div>');
  for (var d=1;d<=dim;d++) {
    var dt=new Date(Date.UTC(y,mo-1,d));
    var dw=(dt.getUTCDay()+6)%7;
    if (dw>4){if(dw===5)flushWeek();continue;}
    var key=month+'-'+String(d).padStart(2,'0');
    var rec=days[key];
    if (rec){monthTotal+=rec.pnl;monthTrades+=rec.count;weekSum+=rec.pnl;weekHas=true;}
    var bg='#0b1220',fg='#334155';
    if (rec){
      var inten=maxAbs>0?Math.min(1,Math.abs(rec.pnl)/maxAbs):0;
      bg=rec.pnl>=0?'rgba(34,197,94,'+(.1+.35*inten).toFixed(2)+')'
                   :'rgba(239,68,68,'+(.1+.35*inten).toFixed(2)+')';
      fg=rec.pnl>=0?'#22c55e':'#ef4444';
    }
    cells.push('<div class="jnl-cal-cell" style="background:'+bg+';border:1px solid '+(rec?fg+'55':'#1e293b')+'">'+
      '<div style="color:#475569;font-size:8px">'+d+'</div>'+
      (rec?'<div style="color:'+fg+';font-size:10px;font-weight:700">'+jnl_fmt$(rec.pnl)+'</div>'+
           '<div style="color:#64748b;font-size:8px">T:'+rec.count+'</div>':'')+
      '</div>');
    if (dw===4) flushWeek();
  }
  if (weekHas) flushWeek();
  html+=cells.join('')+'</div>';
  html+='<div style="margin-top:8px;font-size:11px;color:#94a3b8">Month: <b style="color:'+(monthTotal>=0?'#22c55e':'#ef4444')+'">'+jnl_fmt$(monthTotal)+'</b> · '+monthTrades+' trades</div></div>';
  el.innerHTML=html;
  el.querySelectorAll('.jnl-cal-nav').forEach(function(btn) {
    btn.addEventListener('click',function() {
      var dir=parseInt(btn.getAttribute('data-dir'),10);
      var nm=mo+dir, ny=y;
      if (nm<1){nm=12;ny--;} if (nm>12){nm=1;ny++;}
      try{localStorage.setItem('jnl_cal_month',ny+'-'+String(nm).padStart(2,'0'));}catch(_){}
      jnl_renderCalendarTab(__trades);
    });
  });
}

    tile('Max drawdown','−'+jnl_fmt$(Math.abs(m.maxDD||0)).replace('-',''),'#fca5a5',m.maxDDPct!=null?m.maxDDPct.toFixed(0)+'% dip':'peak→valley')+
    tile('Worst streak',(m.maxLossStreak||0)+' losses','#fca5a5','in a row')+
    tile('Fees paid',jnl_fmt$(m.fees||0),'#94a3b8','commissions')+
    '</div></div>';
  var rVals=closed.map(jnl_signedR).filter(function(r){return r!=null;});
  if (rVals.length>=3) {
    var rEdges=[[-Infinity,-2,'≤−2R'],[-2,-1,'−2..−1'],[-1,0,'−1..0'],[0,1,'0..1'],[1,2,'1..2'],[2,3,'2..3'],[3,Infinity,'>3R']];
    html+=histSvg(rEdges.map(function(e){
      return {label:e[2], n:rVals.filter(function(r){return r>e[0]&&r<=e[1];}).length, color:e[1]<=0?'#ef4444':'#22c55e'};
    }),'R-MULTIPLE DISTRIBUTION',rVals.length+' trades · R = result ÷ risk at entry (requires SL). +2R = made 2× the heat.');
  } else {
    html+='<div class="jnl-corr-note">R-distribution needs ≥3 trades with SL set.</div>';
  }
  var pnls=closed.map(function(t){return t.netPnl;});
  var absMax=Math.max.apply(null,pnls.map(Math.abs));
  if (absMax>0) {
    var step=absMax/3;
    var edges=[-3,-2,-1,0,1,2,3].map(function(k){return k*step;});
    var buckets=[];
    for (var i=0;i<edges.length-1;i++) {
      var lo=edges[i],hi=edges[i+1];
      buckets.push({label:jnl_fmt$(lo).replace('.00','')+'…',
        n:pnls.filter(function(p){return p>lo&&p<=hi;}).length, color:hi<=0?'#ef4444':'#22c55e'});
    }
    html+=histSvg(buckets,'P&amp;L DISTRIBUTION ($)','many small red + few large green = low win-rate edge');
  }
  el.innerHTML=html;
}

// ── Stats catalog ─────────────────────────────────────────────────────────────
function jnl_renderStatsCatalog(trades) {
  var el=document.getElementById('jnl-stats-catalog'); if (!el) return;
  var closed=(trades||[]).filter(function(t){return !t.open && t.netPnl!=null;});
  if (!closed.length){el.innerHTML='<div class="jnl-corr-note">No closed trades yet.</div>';return;}
  var open=(trades||[]).filter(function(t){return t.open;});
  var m=jnl_accountMetrics(closed);
  var wins=closed.filter(function(t){return t.netPnl>0;});
  var losses=closed.filter(function(t){return t.netPnl<0;});
  var pnls=closed.map(function(t){return t.netPnl;});
  var best=pnls.length?Math.max.apply(null,pnls):null;
  var worst=pnls.length?Math.min.apply(null,pnls):null;
  var days=jnl_dailyPnl(closed); var nDays=Object.keys(days).length;
  function durSum(list){return list.reduce(function(a,t){return a+(t.durationMs||0);},0);}
  var durs=closed.map(function(t){return t.durationMs;}).filter(function(d){return d!=null;});
  var vol=closed.reduce(function(a,t){return a+(t.shares||0);},0);
  var volW=wins.reduce(function(a,t){return a+(t.shares||0);},0);
  var volL=losses.reduce(function(a,t){return a+(t.shares||0);},0);
  function M(name,val,color){return {name:name,val:val,color:color||'#e2e8f0'};}
  function $c(v){return v>=0?'#22c55e':'#ef4444';}
  function $f(v){return v==null?'—':jnl_fmt$(v);}
  function nf(v,d){return v==null||!isFinite(v)?v===Infinity?'∞':'—':v.toFixed(d===undefined?2:d);}
  function kf(v){return v>=1e3?(v/1e3).toFixed(1)+'K':String(v);}
  var groups=[
    {name:'📈 Performance & P&L', metrics:[
      M('Total net P&L',$f(m.netPnl),$c(m.netPnl)), M('Profit P&L (winners)',$f(m.grossWin),'#22c55e'),
      M('Loss P&L (losers)',$f(m.grossLoss),'#ef4444'), M('Expectancy / trade',$f(m.expectancy),$c(m.expectancy)),
      M('Avg P&L / day',nDays?$f(m.netPnl/nDays):'—',$c(m.netPnl)), M('Best trade',$f(best),'#22c55e'),
      M('Worst trade',$f(worst),'#ef4444'), M('P&L stdev',$f(jnl_stdev(pnls)),'#f59e0b'),
    ]},
    {name:'🔁 Trade Statistics', metrics:[
      M('Closed trades',m.closed), M('Open trades',open.length),
      M('Winning trades',m.wins,'#22c55e'), M('Losing trades',m.losses,'#ef4444'),
      M('Win rate',m.winRate!=null?m.winRate.toFixed(1)+'%':'—',m.winRate>=50?'#22c55e':'#f59e0b'),
      M('Profit factor',nf(m.profitFactor),m.profitFactor>=1.5?'#22c55e':'#f59e0b'),
      M('Payoff ratio',m.payoff!=null?nf(m.payoff)+':1':'—'),
      M('Avg winner',$f(m.avgWin),'#22c55e'), M('Avg loser',$f(m.avgLoss),'#ef4444'),
      M('Long trades',m.longCount+' · '+$f(m.longPnl),$c(m.longPnl)),
      M('Short trades',m.shortCount+' · '+$f(m.shortPnl),$c(m.shortPnl)),
      M('Max win streak',m.maxWinStreak+'W','#22c55e'), M('Max loss streak',m.maxLossStreak+'L','#ef4444'),
    ]},
    {name:'⏱ Time Analysis', metrics:[
      M('Total time in trades',jnl_fmtDur(durSum(closed))),
      M('Winning trades duration',jnl_fmtDur(durSum(wins)),'#22c55e'),
      M('Losing trades duration',jnl_fmtDur(durSum(losses)),'#ef4444'),
      M('Avg duration',jnl_fmtDur(jnl_mean(durs))),
      M('Max duration',durs.length?jnl_fmtDur(Math.max.apply(null,durs)):'—'),
      M('Avg winner hold',jnl_fmtDur(m.holdWin),'#22c55e'),
      M('Avg loser hold',jnl_fmtDur(m.holdLoss),'#ef4444'),
    ]},
    {name:'💸 Costs & Fees', metrics:[
      M('Total fees',$f(m.fees),'#f59e0b'),
      M('Avg fees / trade',m.closed?$f(m.fees/m.closed):'—'),
      M('Avg fees / day',nDays?$f(m.fees/nDays):'—'),
      M('Fees % of profits',m.grossWin>0?(m.fees/m.grossWin*100).toFixed(1)+'%':'—','#f59e0b'),
    ]},
    {name:'📦 Volume', metrics:[
      M('Total volume',kf(vol)), M('Winning volume',kf(volW),'#22c55e'),
      M('Losing volume',kf(volL),'#ef4444'),
      M('Avg shares / trade',m.closed?kf(Math.round(vol/m.closed)):'—'),
      M('P&L per share',vol>0?'$'+(m.netPnl/vol).toFixed(3):'—',$c(m.netPnl)),
    ]},
  ];
  var html=groups.map(function(g,gi){
    return '<details class="jnl-stat-group"'+(gi===0?' open':'')+'>'+
      '<summary>'+g.name+' <span style="color:#475569;font-weight:400">· '+g.metrics.length+' metrics</span></summary>'+
      '<div class="jnl-stat-cards">'+
      g.metrics.map(function(mt){
        return '<div class="jnl-stat-card"><div class="s-name">'+mt.name+'</div>'+
          '<div class="s-val" style="color:'+mt.color+'">'+mt.val+'</div></div>';
      }).join('')+
      '</div></details>';
  }).join('');
  var symbols=jnl_bucketStats(closed,function(t){return t.ticker;})
    .sort(function(a,b){return Math.abs(b.pnl)-Math.abs(a.pnl);}).slice(0,12);
  if (symbols.length) {
    html+='<details class="jnl-stat-group" open><summary>🏷 Symbol Analysis <span style="color:#475569;font-weight:400">· top '+symbols.length+'</span></summary>'+
      '<div style="padding:8px 12px 12px;overflow-x:auto"><table class="jnl-tbl">'+
      '<thead><tr><th>Symbol</th><th>N</th><th>Win%</th><th>Net</th><th>Exp/tr</th></tr></thead><tbody>'+
      symbols.map(function(s){
        return '<tr><td>'+esc(s.label)+'</td><td>'+s.n+'</td>'+
          '<td style="color:'+(s.winRate>=50?'#22c55e':'#f59e0b')+'">'+s.winRate.toFixed(0)+'%</td>'+
          '<td style="color:'+(s.pnl>=0?'#22c55e':'#ef4444')+';font-weight:700">'+jnl_fmt$(s.pnl)+'</td>'+
          '<td>'+jnl_fmt$(s.exp)+'</td></tr>';
      }).join('')+
      '</tbody></table></div></details>';
  }
  el.innerHTML=html;
}

// ── Setups ────────────────────────────────────────────────────────────────────
function jnl_renderSetupStatsSection(trades) {
  var el=document.getElementById('jnl-setup-stats'); if (!el) return;
  var closed=(trades||[]).filter(function(t){return !t.open && t.netPnl!=null;});
  var grouped={};
  closed.forEach(function(t) {
    var s=jnl_setupLabel(t); if (!s) return;
    if (!grouped[s]) grouped[s]=[];
    grouped[s].push(t);
  });
  var stats=Object.keys(grouped).map(function(setup) {
    var ts=grouped[setup];
    var wins=ts.filter(function(t){return t.netPnl>0;});
    var totalPnl=ts.reduce(function(a,t){return a+t.netPnl;},0);
    var rVals=ts.map(jnl_signedR).filter(function(r){return r!=null;});
    return {setup:setup, n:ts.length, wins:wins.length,
      winRate:ts.length?wins.length/ts.length*100:0,
      totalPnl:totalPnl, avgPnl:ts.length?totalPnl/ts.length:0,
      avgR:rVals.length?jnl_mean(rVals):null, trades:ts};
  }).filter(function(s){return s.n>=3;}).sort(function(a,b){return b.totalPnl-a.totalPnl;});
  if (!stats.length) {
    el.innerHTML='<div class="jnl-corr-note">Need ≥3 trades per setup.</div>';
    return;
  }
  function pfStr(ts) {
    var m=jnl_accountMetrics(ts);
    if (m.profitFactor===Infinity) return '∞';
    return m.profitFactor!=null?m.profitFactor.toFixed(2):'—';
  }
  var html='<div style="overflow-x:auto"><table class="jnl-tbl">'+
    '<thead><tr><th>Setup ID</th><th>N</th><th>Win%</th><th>Exp/tr</th><th>PF</th><th>Total</th><th>Avg R</th><th>Equity</th></tr></thead><tbody>'+
    stats.map(function(s) {
      var wrColor=s.winRate>=60?'#22c55e':s.winRate>=40?'#f59e0b':'#ef4444';
      var spark=jnl_equityCurveSvg(s.trades,110,26)||'—';
      return '<tr>'+
        '<td title="'+esc(s.setup)+'">'+esc(s.setup.length>20?'…'+s.setup.slice(-16):s.setup)+'</td>'+
        '<td>'+s.n+'</td>'+
        '<td style="color:'+wrColor+';font-weight:700">'+s.winRate.toFixed(0)+'%</td>'+
        '<td style="color:'+(s.avgPnl>=0?'#22c55e':'#ef4444')+'">'+jnl_fmt$(s.avgPnl)+'</td>'+
        '<td>'+pfStr(s.trades)+'</td>'+
        '<td style="color:'+(s.totalPnl>=0?'#22c55e':'#ef4444')+';font-weight:700">'+jnl_fmt$(s.totalPnl)+'</td>'+
        '<td>'+( s.avgR!=null?s.avgR.toFixed(2)+'R':'—')+'</td>'+
        '<td style="width:110px">'+spark+'</td>'+
        '</tr>';
    }).join('')+
    '</tbody></table></div>';
  el.innerHTML=html;
}

// ── Trades list ───────────────────────────────────────────────────────────────
function renderTrades() {
  var ticker=(document.getElementById('filter-ticker').value||'').toUpperCase().trim();
  var side=document.getElementById('filter-side').value;
  var status=document.getElementById('filter-status').value;
  var sortV=document.getElementById('sort-trades').value;
  var out=__trades.filter(function(t) {
    if (ticker && t.ticker.indexOf(ticker)===-1) return false;
    if (side && t.side!==side) return false;
    if (status==='closed' && t.open) return false;
    if (status==='open' && !t.open) return false;
    return true;
  });
  out.sort(function(a,b) {
    if (sortV==='date-asc') return a.entryTs-b.entryTs;
    if (sortV==='pnl-desc') return (b.netPnl||0)-(a.netPnl||0);
    if (sortV==='pnl-asc') return (a.netPnl||0)-(b.netPnl||0);
    return b.entryTs-a.entryTs;
  });
  // Stats bar
  var closed=out.filter(function(t){return !t.open && t.netPnl!=null;});
  var wins=closed.filter(function(t){return t.netPnl>0;});
  var totalPnl=closed.reduce(function(a,t){return a+t.netPnl;},0);
  var bar=document.getElementById('jnl-stats-bar');
  bar.innerHTML='<span><b style="color:#e2e8f0">'+out.length+'</b> trades</span>'+
    '<span><b style="color:#e2e8f0">'+closed.length+'</b> closed</span>'+
    '<span>Win: <b style="color:'+(wins.length/closed.length>=.5?'#22c55e':'#ef4444')+'">'+(closed.length?Math.round(wins.length/closed.length*100):'—')+'%</b></span>'+
    '<span>Net: <b style="color:'+(totalPnl>=0?'#22c55e':'#ef4444')+'">'+jnl_fmt$(totalPnl)+'</b></span>';
  // Cards
  var c=document.getElementById('jnl-cards-container');
  if (!out.length) { c.innerHTML='<div class="jnl-corr-note">No trades match filters.</div>'; return; }
  // Group by day
  var dayOrder=[], dayMap={};
  out.forEach(function(t) {
    if (!dayMap[t.date]){dayMap[t.date]=[];dayOrder.push(t.date);}
    dayMap[t.date].push(t);
  });
  c.innerHTML=dayOrder.map(function(d) {
    return renderDayHeader(d,dayMap[d])+dayMap[d].map(renderTradeCard).join('');
  }).join('');
  c.querySelectorAll('.jnl-del-btn').forEach(function(btn) {
    btn.addEventListener('click',async function() {
      var id=btn.getAttribute('data-id');
      if (!confirm('Delete this trade?')) return;
      await fetch('/api/journal/trades/'+id,{method:'DELETE'});
      await loadAll();
    });
  });
  c.querySelectorAll('.jnl-setup-sel').forEach(function(sel) {
    sel.addEventListener('change',async function() {
      var id=sel.getAttribute('data-id');
      var setupId=sel.value||null;
      await fetch('/api/journal/trades/'+id,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({setup_id:setupId})
      });
      await loadAll();
    });
  });
}

function renderDayHeader(date, dayTrades) {
  var closed=dayTrades.filter(function(t){return !t.open && t.netPnl!=null;});
  var net=closed.reduce(function(a,t){return a+t.netPnl;},0);
  var wins=closed.filter(function(t){return t.netPnl>0;});
  var color=net>=0?'#22c55e':'#ef4444';
  var dObj=new Date(date+'T12:00Z');
  var nice=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dObj.getUTCDay()]+', '+
    ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dObj.getUTCMonth()]+
    ' '+dObj.getUTCDate()+', '+dObj.getUTCFullYear();
  var wr=closed.length?Math.round(wins.length/closed.length*100)+'%':'—';
  return '<div class="jnl-day-head" style="border-left-color:'+color+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px">'+
    '<span style="color:#94a3b8;font-size:11px;font-weight:600">'+nice+'</span>'+
    '<span style="font-size:17px;font-weight:800;color:'+color+'">'+jnl_fmt$(net)+'</span>'+
    '</div>'+
    '<div class="jnl-day-grid">'+
    '<div><span style="color:#475569">Trades </span><b>'+dayTrades.length+'</b></div>'+
    '<div><span style="color:#475569">Closed </span><b>'+closed.length+'</b></div>'+
    '<div><span style="color:#475569">Win% </span><b style="color:'+(wins.length/closed.length>=.5?'#22c55e':'#f59e0b')+'">'+wr+'</b></div>'+
    '<div><span style="color:#475569">Net </span><b style="color:'+color+'">'+jnl_fmt$(net)+'</b></div>'+
    '</div></div>';
}

function renderTradeCard(t) {
  var isWin=t.netPnl!=null && t.netPnl>0;
  var isLoss=t.netPnl!=null && t.netPnl<0;
  var pnlColor=isWin?'#22c55e':isLoss?'#ef4444':'#94a3b8';
  var sideColor=t.side==='long'?'#22c55e':'#f97316';
  var sideLabel=t.side==='long'?'▲ Long':'▼ Short';
  function stat(l,v,c){return '<div style="color:#475569">'+l+': <span style="color:'+(c||'#94a3b8')+';font-weight:600">'+v+'</span></div>';}
  return '<div class="jnl-card">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px">'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
    '<span style="font-size:16px;font-weight:700;color:#e2e8f0">'+esc(t.ticker)+'</span>'+
    '<span style="font-size:11px;font-weight:600;color:'+sideColor+';background:'+sideColor+'1a;padding:2px 7px;border-radius:4px">'+sideLabel+'</span>'+
    (t.open?'<span style="font-size:10px;color:#f59e0b;background:#f59e0b1a;padding:2px 6px;border-radius:4px">OPEN</span>':'')+
    (t.setup?'<span style="font-size:10px;color:#93c5fd;background:#1e3a5f44;border:1px solid #1e40af55;padding:2px 7px;border-radius:4px" title="'+esc(t.setup)+'">'+esc(t.setup.length>14?'…'+t.setup.slice(-10):t.setup)+'</span>':'')+
    (t.account?'<span style="font-size:9px;color:#7dd3fc;background:#0c2a4a;border:1px solid #1e3a5f;padding:1px 6px;border-radius:3px">'+esc(t.account)+'</span>':'')+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:8px">'+
    '<span style="font-size:13px;font-weight:700;color:'+pnlColor+'">'+jnl_fmt$(t.netPnl)+'</span>'+
    '<span style="font-size:11px;color:'+pnlColor+'">'+jnl_fmtPct(t.pctMove)+'</span>'+
    '<button class="jnl-del-btn" data-id="'+t.id+'" style="font-size:11px;padding:2px 7px;background:#1e293b;color:#64748b;border:1px solid #334155;border-radius:5px">🗑</button>'+
    '</div></div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;font-size:11px">'+
    stat('Date',t.date)+
    stat('Entry',t.entryPrice?'$'+t.entryPrice.toFixed(2):'—')+
    stat('Exit',t.exitPrice?'$'+t.exitPrice.toFixed(2):'—')+
    stat('Shares',t.shares?t.shares.toLocaleString():'—')+
    stat('In',jnl_fmtTime(t.entryTs))+
    stat('Out',jnl_fmtTime(t.exitTs))+
    stat('Duration',jnl_fmtDur(t.durationMs))+
    stat('Net P&L',jnl_fmt$(t.netPnl),pnlColor)+
    (t.sl?stat('SL','$'+t.sl.toFixed(2)):'')+
    (t.tp?stat('TP','$'+t.tp.toFixed(2)):'')+
    '</div>'+
    (t.notes?'<div style="font-size:10px;color:#64748b;margin-top:6px;font-style:italic">'+esc(t.notes)+'</div>':'')+
    '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'+
    '<span style="font-size:10px;color:#475569">Setup:</span>'+
    '<select class="jnl-setup-sel" data-id="'+t.id+'" style="flex:1;background:#0f172a;border:1px solid #334155;border-radius:5px;color:#94a3b8;font-size:11px;padding:3px 6px;font-family:inherit">'+
    '<option value="">— untagged —</option>'+
    __setups.map(function(s){return '<option value="'+esc(s.id)+'"'+(t.setup_id===s.id?' selected':'')+'>'+esc(s.name)+'</option>';}).join('')+
    '</select></div>'+
    '</div>';
}

// ── Import ────────────────────────────────────────────────────────────────────
function onImportFile(evt) {
  var f=evt.target.files[0]; if (!f) return;
  var reader=new FileReader();
  reader.onload=function(e){ document.getElementById('import-csv').value=e.target.result; };
  reader.readAsText(f);
}
async function doImport() {
  var csv=document.getElementById('import-csv').value.trim();
  var account=document.getElementById('import-account').value.trim();
  var msg=document.getElementById('import-msg');
  if (!csv){msg.className='err';msg.textContent='Paste CSV first.';return;}
  msg.className='';msg.textContent='Importing…';
  try {
    var r=await fetch('/api/journal/import',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({csv:csv,account:account||null})});
    var d=await r.json();
    if (d.ok) {
      msg.className='ok';
      msg.textContent='✓ Imported '+d.imported+' trades'+(d.skipped?' ('+d.skipped+' skipped)':'')+(d.format?' ['+d.format+']':'');
      document.getElementById('import-csv').value='';
      await loadAll();
    } else {
      msg.className='err'; msg.textContent='Error: '+(d.error||'Unknown error');
    }
  } catch(e){msg.className='err';msg.textContent='Error: '+e.message;}
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===name);});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+name);});
  try{localStorage.setItem('jnl_tab',name);}catch(_){}
}

document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click',function(){switchTab(btn.getAttribute('data-tab'));});
});
document.getElementById('filter-account').addEventListener('change',function(){applyScope();renderAll();});
document.getElementById('filter-source').addEventListener('change',function(){applyScope();renderAll();});

// init
(function() {
  var tab='overview'; try{tab=localStorage.getItem('jnl_tab')||'overview';}catch(_){}
  switchTab(tab);
  loadAll();
})();
</script>
